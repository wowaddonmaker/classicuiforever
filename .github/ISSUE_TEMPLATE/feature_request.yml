name: Feature Request
description: Something the addon should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Please check you have this addon first.** Several addons use a similar mix of the same words, and reports meant for them land here by mistake.

        This one is **ClassicUI Forever**: its folder is `ClassicUIForever` and its commands are under `/fcui`. If the folder or the slash command on yours reads differently, it is a different project and this tracker cannot help with it.
  - type: textarea
    id: request
    attributes:
      label: What would you like?
      description: What it should do and what it would be for. If it is a piece of the old interface, a screenshot of the original helps more than anything.
    validations:
      required: true
