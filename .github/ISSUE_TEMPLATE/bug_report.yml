name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: report
    attributes:
      label: What happened?
      description: What you saw and what you expected instead. Useful to include if you can - which part of the addon, whether you are on WoW Forever or retail, the addon version from the addon list, and a screenshot. A screenshot helps more than anything.
    validations:
      required: true
