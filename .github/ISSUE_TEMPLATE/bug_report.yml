name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please check you have this addon first.** Several addons use a similar mix of the same words, and reports meant for them land here by mistake.

        This one is **ClassicUI Forever**: its folder is `ClassicUIForever` and its commands are under `/fcui`. If the folder or the slash command on yours reads differently, it is a different project and this tracker cannot help with it.
  - type: textarea
    id: report
    attributes:
      label: What happened?
      description: What you saw and what you expected instead. Useful to include if you can - which part of the addon, whether you are on WoW Forever or retail, the addon version from the addon list, and a screenshot. A screenshot helps more than anything.
    validations:
      required: true
