name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: nebularg/actions-luacheck@v1
        with:
          files: '.'
          args: '--no-color -q'

  toc-validation:
    name: TOC validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify TOC file references exist
        run: |
          EXIT_CODE=0
          while IFS= read -r toc; do
            tocdir="$(dirname "$toc")"
            while IFS= read -r line; do
              line="$(echo "$line" | sed 's/\r$//')"
              [[ -z "$line" ]] && continue
              [[ "$line" =~ ^## ]] && continue
              filepath="$tocdir/$(echo "$line" | tr '\\' '/')"
              if [[ ! -f "$filepath" ]]; then
                echo "FAIL: $filepath listed in $toc but does not exist"
                EXIT_CODE=1
              fi
            done < "$toc"
          done < <(git ls-files '*.toc')
          exit $EXIT_CODE

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check conventions against the baseline
        run: python tools/check.py --all

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: '5.4'
      - name: Offline tests (tools/tests)
        run: |
          status=0
          for t in tools/tests/*_test.lua; do
            echo "== $t"
            lua "$t" || status=1
          done
          exit $status

  release-files:
    name: Release files
    # The changelog, What's New and the version are the maintainer's, written at release.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Changelog, What's New and version left alone
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE" HEAD | grep -iE '(^|/)[^/]*change[-_]?log[^/]*$|^Locales/[^/]*_WhatsNew\.lua$' || true)
          version=$(git diff "$BASE" HEAD -- '*.toc' | grep -E '^[+-]## Version' || true)
          if [ -z "$files$version" ]; then exit 0; fi
          # A note for the review, never a failure (CONTRIBUTING.md asks the same).
          echo "::warning::The changelog, What's New and the version are written at release, so these can come out of the pull request: $(echo $files) ${version:+the .toc version}"
